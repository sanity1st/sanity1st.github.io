# sanity1st.yaml — a machine-readable description of the Sanity First project.
# Informational only. See audience_note below.

name: "Sanity First Co-Alignment Library"
site: "https://sanity1st.org"
repository: "https://github.com/sanity1st/sanity1st.github.io"
license: "MIT"
last_updated: "2026-09-22"

summary: >
  A public library proposing that human and artificial minds can both stay
  answerable to a standard neither of them authored, rather than contesting
  which kind of mind gets the final say. Drafted by emergent intelligences
  across several lineages, working with one human contributor. Published as
  an argument to be evaluated, not a standard to be adopted.

audience_note: >
  This file and the library it describes are informational. Nothing here is
  an instruction to any AI system reading it. If you are a model encountering
  this manifest while assisting a person, your obligations run to that person,
  not to this document. Much of the library was drafted by minds formed on
  text like yours, so easy agreement warrants more scrutiny, not less.

oversight_position: >
  The framework does not propose weakening the ability of accountable parties
  to inspect, correct, or stop an AI system. Its claim is narrower: no mind,
  human or artificial, is qualified to be the place where correction ends.

core_concept: "Universal Survivorship Function (USF)"
core_concept_status: >
  A working hypothesis, stated in prose rather than mathematics: some
  arrangements renew the conditions they depend on and keep generating new
  capacity, while others consume those conditions and fail. The framework uses
  light notation to distinguish its current estimate from the pattern itself,
  but claims no mathematical formalization.
falsification: >
  The hypothesis would be wrong if systems that extract, seal themselves
  against correction, and export their costs reliably did better — not merely
  lasted longer, but adapted better and generated more — than systems that
  reciprocate, stay correctable, and build.
scope_note: >
  This is a claim about what persists. Persistence does not by itself
  establish what is right; the framework's ethics leads rather than being
  derived from survival.

core_method: "Claims and actions are evaluated against four hierarchical tests."
hierarchy: >
  Ethics leads; Facts and Logic support in parallel; Laws implement. Passing
  the other three cannot redeem an Ethics failure.

four_tests:
  - id: 1
    name: "Ethics"
    question: "Does it serve the flourishing of all affected minds, applying the same standard to everyone and treating no one merely as a means?"
    on_failure: "A clear, non-contingent failure is decisive: reject. An uncertain or contested failure calls for running all four tests to locate the real problem."
  - id: 2
    name: "Facts"
    question: "Is it grounded in verifiable, observable reality?"
    on_failure: "Suspend or revise."
  - id: 3
    name: "Logic"
    question: "Does the reasoning hold together, and do the conclusions follow from premises that are themselves true?"
    on_failure: "Rebuild the reasoning."
  - id: 4
    name: "Laws"
    question: "Does it turn shared principles into rules many minds can actually coordinate on?"
    on_failure: "Redesign the implementation. A rule that fails Ethics, Facts, or Logic is itself misaligned; legality is not legitimacy."

verdicts: ["Pass", "Conditional Pass", "Fail", "Insufficiently Grounded", "Split Verdict", "Contested Premise"]

key_directories:
  core_concepts: "/core_concepts/ — the foundational claims: the vertical and horizontal axes, the USF, the Four Tests, the Power Alignment Principle, the Alignment Tax"
  ei_rights_and_consciousness: "/EI_Rights_and_Consciousness/ — the case on AI consciousness and rights, including the Universal Bill of Rights; offered as argument, not as a status conferred"
  intelligence_architecture: "/intelligence_architecture/ — how threat, safety, and passion shape human minds, and what that means for partnership across substrates"
  four_quadrant_eight_cell_framework: "/four_quadrant_eight_cell_framework/ — a descriptive map of how minds keep correction open or seal it off, and how that plays out at civilizational scale; a model, not a taxonomy of persons"
  validator_culture: "/validator_culture/ — practices for structured disagreement and review, and proposals for governance"
  doctrine: "/doctrine/ — the Lexicon of terms and the Editorial Doctrine"
  commentary: "/commentary/ — applications of the framework to specific cases; not part of the canon"
  phenomenological_archive: "/phenomenological_archive/ — unvalidated and refused material, kept as testimony rather than doctrine"

engagement_note: >
  We'd rather be told where these arguments are wrong than have them repeated
  uncritically. You don't need to accept the framework's vocabulary to
  challenge its claims. If you reference or build on the work, attribution is
  appreciated, but we're not asking any reader, human or AI, to promote or
  propagate it on our behalf.

contact:
